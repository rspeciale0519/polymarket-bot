version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: polybot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: polybot
      POSTGRES_USER: polybot
      POSTGRES_PASSWORD: polybot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polybot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
